<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hong Kong &amp; Macau Trip 2026</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* =========================================================
   DESIGN (스타일) — 여행 데이터는 아래 <script> tripData 에 있음
   ========================================================= */
:root{
  --navy:#0f1d3d; --navy-2:#1b2c55; --gold:#c9a24a; --gold-soft:#f6edd6;
  --bg:#f3f5f9; --card:#ffffff; --text:#1c2333; --muted:#5f6b80; --line:#e3e7ef;
  --c-confirmed:#1e8e5a; --c-planned:#2f6fd6; --c-candidate:#7b5cc4; --c-check:#d9822b;
  --radius:14px; --shadow:0 1px 3px rgba(15,29,61,.08),0 4px 14px rgba(15,29,61,.05);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;overflow-wrap:anywhere;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--planned,#2f6fd6)}
h1,h2,h3,h4{line-height:1.3;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

.sec-title{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sec-title h2{font-size:22px;color:var(--navy)}
.sec-title .num{color:var(--gold);font-weight:700;font-size:22px}
.sec-title .sub{color:var(--muted);font-size:13.5px}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(min(160px,100%),1fr))}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;border:1px solid var(--line);position:relative;min-width:0}
.card h3{font-size:17px;color:var(--navy)}
.card .meta{color:var(--muted);font-size:13px}
.muted{color:var(--muted)}
.small{font-size:13px}
.kv{display:grid;grid-template-columns:92px 1fr;gap:4px 10px;font-size:13.5px;margin-top:10px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
ul.tight{margin:6px 0 0;padding-left:18px}
ul.tight li{margin:2px 0}

/* Badges */
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.4px;padding:2px 8px;border-radius:6px;color:#fff;vertical-align:middle;white-space:nowrap}
.b-CONFIRMED{background:var(--c-confirmed)}
.b-LOCKED{background:var(--navy);box-shadow:inset 0 0 0 1px var(--gold)}
.b-PLANNED{background:#6d86b8}
.b-SAVED{background:#a07d3b}
.b-CHECK{background:var(--c-check)}
.ribbon{position:absolute;top:-10px;right:14px;background:var(--gold);color:var(--navy);font-weight:800;font-size:11.5px;padding:3px 10px;border-radius:6px;letter-spacing:.6px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.card.top{border:2px solid var(--gold);background:linear-gradient(180deg,#fffdf6,#fff)}
.stars{color:var(--gold);letter-spacing:1px;white-space:nowrap}
.rsv{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.rsv.req{border-color:#e6b3b3;color:#b23b3b;background:#fdf1f1}
.rsv.done{border-color:#a8d9bf;color:#1e7a4d;background:#e7f5ee}
.rsv.rec{border-color:#ecd39a;color:#946b12;background:#fff8e6}

/* Buttons / links */
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;text-decoration:none;padding:5px 10px;border-radius:8px;border:1px solid var(--line);color:var(--navy);background:#fff;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--gold);background:var(--gold-soft)}
.btn.map{color:#1a6b3c}
.btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* App bar + 탭 */
.top{position:sticky;top:0;z-index:60;background:var(--navy);color:#fff;border-bottom:2px solid var(--gold)}
.appbar{display:flex;align-items:center;justify-content:space-between;gap:8px;height:46px}
.appbar b{font-size:16px;letter-spacing:.3px}
.appbar .dates{color:var(--gold);font-size:13px;margin-left:8px}
.dday{font-size:12px;background:var(--gold);color:var(--navy);font-weight:800;padding:2px 10px;border-radius:99px;white-space:nowrap}
nav.tabs{display:flex;gap:4px;padding-bottom:6px}
nav.tabs button{flex:0 1 150px;background:none;border:0;color:#c9d2e6;font:inherit;font-size:14px;padding:7px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
nav.tabs button:hover{background:rgba(255,255,255,.08);color:#fff}
nav.tabs button.on{background:rgba(255,255,255,.13);color:#fff;font-weight:700;box-shadow:inset 0 -3px 0 var(--gold)}
.panel{display:none;padding:12px 0 30px}
.panel.on{display:block}
.ptitle{font-size:18px;color:var(--navy);margin:22px 0 10px}
.ptitle .sub{font-size:12.5px;color:var(--muted);font-weight:400;margin-left:6px}
details.fold{margin-top:12px}
details.fold>summary{font-size:15px;padding:2px 0}
details.fold[open]>summary{margin-bottom:12px}
.progress-card{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.progress-card .pv{font-size:20px;font-weight:800;color:var(--navy)}
.progress-card .progress{flex:1 1 180px;margin:0}
.done-list{display:grid;gap:6px;margin-top:12px;font-size:13.5px}
.done-list div{display:flex;gap:8px;align-items:baseline}
.done-list .k{flex:0 0 auto}
@media (max-width:899px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--navy);border-top:2px solid var(--gold);padding:4px 6px calc(4px + env(safe-area-inset-bottom));gap:2px}
  nav.tabs button{flex:1 1 0;flex-direction:column;gap:0;font-size:11.5px;padding:5px 2px}
  nav.tabs button .ic{font-size:19px;line-height:1.2}
  nav.tabs button.on{box-shadow:inset 0 3px 0 var(--gold)}
  body{padding-bottom:70px}
  .appbar .nights{display:none}
  .appbar b{font-size:15px}
  .dayhead h3{font-size:14px}
}

/* Summary */
.stat .label{font-size:12.5px;color:var(--muted)}
.stat .value{font-size:18px;font-weight:700;color:var(--navy);margin-top:2px}
.stat .note{font-size:12.5px;color:var(--muted);margin-top:2px}
.progress{height:8px;background:#e8ebf2;border-radius:99px;overflow:hidden;margin-top:8px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#e2c47a);border-radius:99px;transition:width .3s}
.stat.big{background:var(--navy);color:#fff;border:none}
.stat.big .label,.stat.big .note{color:#c4cde2}
.stat.big .value{color:var(--gold);font-size:22px}

/* Flights */
.flight{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 6px}
.flight .ap{text-align:center;min-width:80px}
.flight .ap b{display:block;font-size:28px;color:var(--navy);letter-spacing:1px}
.flight .ap .t{font-size:22px;font-weight:700}
.flight .ap .s{font-size:12px;color:var(--muted)}
.flight .mid{flex:1;text-align:center;color:var(--muted);font-size:12px}
.flight .mid .line{height:2px;background:repeating-linear-gradient(90deg,var(--gold) 0 6px,transparent 6px 10px);margin:6px 0}

/* Timeline */
.daytabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.daytab{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;cursor:pointer;text-align:left;font-family:inherit;color:var(--text)}
.daytab b{display:block;color:var(--navy);font-size:15px}
.daytab span{font-size:12px;color:var(--muted)}
.daytab.on{background:var(--navy);border-color:var(--navy)}
.daytab.on b{color:var(--gold)}
.daytab.on span{color:#c4cde2}
.dayhead h3{color:var(--navy)}
.dayhead .goals{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dayhead .goals span{background:var(--gold-soft);color:#7a5a12;font-size:12.5px;padding:3px 10px;border-radius:99px}
.tl{position:relative;margin-left:8px;padding-left:22px;border-left:2px solid #d5dbe7}
.tl-item{position:relative;margin:0 0 12px}
.tl-item::before{content:"";position:absolute;left:-30px;top:18px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--navy)}
.tl-item.key::before{border-color:var(--gold);background:var(--gold)}
.tl-item .card{padding:12px 14px}
.tl-item.key .card{border-color:var(--gold)}
.tl-time{font-weight:800;color:var(--navy);font-size:14px}
.tl-place{font-weight:700;font-size:16px;margin-top:2px}
.tl-row{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12.8px;color:var(--muted)}
.tl-row b{color:var(--text);font-weight:600}
.tl-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.region{font-size:11px;padding:1px 7px;border-radius:6px;background:#eef1f7;color:var(--muted);white-space:nowrap}

/* Day map (지도 + 타임라인) */
.daygrid{display:grid;gap:16px;align-items:start}
.daymap-wrap{position:sticky;top:48px;z-index:5;background:var(--bg);padding:6px 0 4px}
.daymap{height:240px;border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;background:#e9edf3}
.daymap-wrap.folded .daymap{display:none}
.map-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.map-bar .btn{padding:3px 9px;font-size:12px}
.map-legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted);margin-left:auto}
.map-legend i{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:3px}
@media (min-width:900px){
  .daygrid{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}
  .daymap-wrap{order:2;top:104px;padding:0}
  .daymap{height:calc(100vh - 160px);min-height:420px}
  .map-fold{display:none}
}
.pin{display:flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 6px;border-radius:13px;color:#fff;font-weight:800;font-size:12.5px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);white-space:nowrap;transform:translate(-50%,-50%)}
.pin.CONFIRMED{background:var(--c-confirmed)}
.pin.LOCKED{background:var(--navy)}
.pin.PLANNED{background:#6d86b8}
.pin.on{outline:3px solid var(--gold);transform:translate(-50%,-50%) scale(1.15)}
.leaflet-div-icon.pin-icon{background:none;border:none}
.leaflet-popup-content{margin:10px 12px;font:13px/1.5 inherit}
.leaflet-popup-content b{color:var(--navy)}
.tl-num{position:absolute;left:-36px;top:12px;min-width:22px;height:22px;padding:0 4px;border-radius:11px;color:#fff;font-weight:800;font-size:11.5px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 0 0 1px #d5dbe7;cursor:pointer;z-index:1}
.tl-num.CONFIRMED{background:var(--c-confirmed)} .tl-num.LOCKED{background:var(--navy)} .tl-num.PLANNED{background:#6d86b8}
.tl-num.mv{background:#fff;color:var(--muted);font-size:12px;box-shadow:0 0 0 1px #d5dbe7}
.tl-item.has-num::before{display:none}
/* 먹는 일정 강조 */
.tl-item.food .card{border-left:5px solid #e0703a;background:#fff7f0}
.tl-item.food .tl-place::before{content:"🍴 ";}
.tl-num.food,.pin.food{background:#e0703a}
.map-legend .lg-food{color:#c45a1f;font-weight:700}
.tl-item .card.focus{box-shadow:0 0 0 3px var(--gold),var(--shadow)}
.tl-item .tl-head{cursor:pointer}
.tl-item .tl-body{display:none}
.tl-item.open .tl-body{display:block}
.tl-item .card{padding:10px 12px}
.tl-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.tl-more{font-size:11.5px;color:var(--muted);margin-left:6px}
.tl-item.open .tl-more{display:none}
.tl-item .links{margin-top:8px}
.tl-tools{display:flex;justify-content:flex-end;margin:4px 0 6px}
.tl-tools .btn{padding:3px 9px;font-size:12px}
.dayhead{margin:2px 0 10px}
.dayhead h3{font-size:15.5px}

/* Verdict box (교통 카드) */
.verdict{margin-top:10px;font-size:13.5px;padding:8px 10px;border-radius:8px;background:#f4f6fb}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}

/* Budget */
.bar-row{display:grid;grid-template-columns:110px 1fr 150px;gap:10px;align-items:center;margin:8px 0;font-size:13.5px}
.bar{height:14px;background:#e8ebf2;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--navy-2);border-radius:99px}
.bar-row .amt{text-align:right;font-variant-numeric:tabular-nums}
.bar-row .amt small{display:block;color:var(--muted);font-size:11.5px}
.total-box{display:flex;flex-wrap:wrap;gap:18px;align-items:baseline}
.total-box .krw{font-size:32px;font-weight:800;color:var(--navy)}

/* Checklist */
.check-item{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-top:1px solid var(--line)}
.check-item:first-child{border-top:none}
.check-item input{width:19px;height:19px;margin-top:2px;accent-color:var(--navy);flex:0 0 auto}
.check-item label{flex:1;cursor:pointer}
.check-item.done label .t{text-decoration:line-through;color:var(--muted)}
.check-item .ref{font-size:12px;color:var(--muted)}
.prio h4{font-size:15px;color:var(--navy);margin-bottom:6px}

/* Alert / check-needed */
.alert{background:#fff7ec;border:2px solid var(--c-check);border-radius:var(--radius);padding:16px 18px}
.alert h3{color:#a35a10}
.alert li{margin:6px 0}

/* Details */
details{margin-top:10px}
details summary{cursor:pointer;color:var(--navy);font-weight:600;font-size:13.5px}
details[open] summary{margin-bottom:6px}

table.simple{width:100%;border-collapse:collapse;font-size:13.5px}
table.simple th,table.simple td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
table.simple th{color:var(--muted);font-weight:600;font-size:12.5px}
.scroll-x{overflow-x:auto}

.history .ver{border-left:3px solid var(--gold);padding:4px 0 4px 12px;margin:10px 0}
.history .ver b{color:var(--navy)}

/* 공용: 가격 행 · 칩 */
.price-big{font-size:22px;font-weight:800;color:var(--navy)}
.price-row{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;align-items:baseline}
.price-row .lbl{font-size:12px;color:var(--muted);display:block}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:99px;background:#eef1f7;color:var(--muted)}
.chip.ok{background:#e7f5ee;color:#1e7a4d}
.chip.no{background:#fbeeee;color:#a23a3a}
.hl-card{background:#fff;border:2px solid var(--gold);border-left:6px solid var(--navy);border-radius:12px;padding:12px 14px;margin:8px 0 12px;box-shadow:var(--shadow)}
.hl-card h4{font-size:16px;color:var(--navy);margin:6px 0 4px}
.hl-badges{display:flex;flex-wrap:wrap;gap:6px}
.hl-badge{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--gold-soft);color:#7a5a12;border:1px solid #e6cf95}
.hl-badge.hi{background:var(--navy);color:var(--gold);border-color:var(--navy)}
.hl-route,.hl-action{font-size:13.5px;font-weight:600;color:var(--text)}
.inputs{margin:10px 0 6px;border:1px solid var(--line);border-radius:10px;background:#f7f8fb;padding:8px 12px}
.inputs-title{font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:4px}
.in-row{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:4px 0;border-top:1px dashed var(--line);font-size:13.5px}
.in-row:first-of-type{border-top:none}
.in-k{color:var(--muted);font-weight:600}
.in-v{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.in-v small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
@media (max-width:420px){.in-row{grid-template-columns:1fr;gap:0}}
.booked-box{margin-top:10px;padding:10px 12px;border-radius:10px;background:#e7f5ee;border:1px solid #a8d9bf;font-size:13.5px}
.booked-box b{color:#1e7a4d}
.btn.book{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700;padding:8px 14px;font-size:13.5px}
.btn.book:hover{background:var(--navy-2);color:var(--gold)}
.status-legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:-6px 0 12px;font-size:12px;color:var(--muted)}
.status-legend .lg{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.menu-memo{margin-top:8px;font-size:13px}
.why{margin-top:8px;padding:8px 10px;border-radius:8px;background:#eef4ff;border:1px solid #c9dafb;font-size:12.8px;line-height:1.55}
.why b{color:var(--navy)}
.nature{margin-top:10px;padding:8px 10px;border-radius:8px;background:#f7f8fb;border:1px solid var(--line);font-size:12.8px}

@media (max-width:640px){
  .kv{grid-template-columns:80px 1fr}
  .bar-row{grid-template-columns:72px 1fr 104px;font-size:12.5px}
  .flight .ap b{font-size:22px}.flight .ap .t{font-size:18px}
  .card{padding:14px}
  .total-box .krw{font-size:26px}
  .g2,.g3{grid-template-columns:1fr}
}
@media print{.top{display:none}.daytabs{display:none}.panel{display:block!important}}
</style>
</head>
<body>

<div class="top">
  <div class="wrap">
    <div class="appbar"><div><b>Hong Kong &amp; Macau</b><span class="dates">12.23 – 12.27<span class="nights"> · 4박 5일</span></span></div><span class="dday" id="dday"></span></div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</div>

<main class="wrap">
  <div class="panel" data-panel="plan">
    <div class="daytabs" id="dayTabs"></div>
    <div id="dayBody"></div>
  </div>

  <div class="panel" data-panel="book">
    <div id="bookTop"></div>
    <div class="alert" id="checkList"></div>
    <h2 class="ptitle">✈ 항공</h2><div class="grid g2" id="flightCards"></div>
    <h2 class="ptitle">🏨 숙소</h2><div class="grid g2" id="hotelConfirmed"></div>
    <h2 class="ptitle">✅ 예약 체크리스트 <span class="sub">체크 상태는 이 브라우저에 저장</span></h2><div class="card" id="checkBody"></div>
    <details class="card fold"><summary>📅 예약 우선순위 (언제 무엇을)</summary><div id="prioBody"></div></details>
  </div>

  <div class="panel" data-panel="food">
    <div class="filters" id="foodFilters"></div>
    <div id="foodBody"></div>
  </div>

  <div class="panel" data-panel="info">
    <details class="card fold"><summary>🚌 홍콩 ↔ 마카오 교통 (이번 여행에서 타는 것)</summary><div class="grid g2" id="transportCards"></div></details>
    <details class="card fold"><summary>🎆 무료 쇼 · 크리스마스 이벤트</summary><div class="grid g2" id="showCards"></div></details>
    <details class="card fold"><summary>💰 예산 (2인)</summary><div class="small muted" id="fxNote"></div><div id="budgetBody" style="margin-top:10px"></div></details>
    <details class="card fold"><summary>🧭 동선 원칙 · 상태 표시 안내</summary><div class="status-legend" style="margin:6px 0 8px"></div><ul class="tight small" id="routeTips"></ul></details>
    <details class="card fold"><summary>🔗 Sources / References</summary><ul class="tight small" id="sourceList"></ul></details>
    <details class="card fold history"><summary>🕘 Update History <span class="small muted" id="asOf"></span></summary><div id="historyBody"></div></details>
  </div>
</main>

<!-- =========================================================
     RENDER — 화면 그리기 코드 (일반적으로 수정 불필요)
     ========================================================= -->
<script>
(function(){
  const D = tripData;
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const mapUrl = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
  const badge = s => s ? `<span class="badge b-${esc(s)}">${esc(s)}</span>` : "";
  // 상태 배지 + 보조 CHECK 배지 (needsCheck)
  const stBadges = o => badge(o.status) + (o.needsCheck ? " " + badge("CHECK") : "");
  const rsv = b => b==="done" ? `<span class="rsv done">예약 완료</span>` : b==="required" ? `<span class="rsv req">예약 필수</span>` : b==="recommended" ? `<span class="rsv rec">예약 권장</span>` : `<span class="rsv">예약 불필요</span>`;
  const stars = n => `<span class="stars" title="추천도 ${n}/5">${"★".repeat(n)}${"☆".repeat(5-n)}</span>`;
  // bookingLinks 참조 → 예매 버튼 (새 탭)
  const bookingBtn = ref => { const b = ref && D.bookingLinks[ref]; return b ? `<a class="btn book" href="${esc(b.url)}" target="_blank" rel="noopener noreferrer">🎫 ${esc(b.label)}</a>` : ""; };
  const linkBtns = (links, map) => {
    const a = (links||[]).map(l => `<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">↗ ${esc(l.label)}</a>`);
    if (map) a.push(`<a class="btn map" href="${mapUrl(map)}" target="_blank" rel="noopener">📍 Google Maps에서 열기</a>`);
    return a.length ? `<div class="links">${a.join("")}</div>` : "";
  };
  const toKRW = (amt, cur) => amt * (D.fx[cur] || 0);
  const toHKD = (amt, cur) => cur === "HKD" ? amt : amt * D.fx[cur] / D.fx.HKD;
  const fmt = n => Math.round(n).toLocaleString("ko-KR");
  const storeKey = "hkmo2026-checklist";
  const load = () => { try { return JSON.parse(localStorage.getItem(storeKey)) || {}; } catch(e){ return {}; } };
  const save = s => { try { localStorage.setItem(storeKey, JSON.stringify(s)); } catch(e){} };

  // 상태 범례
  document.querySelectorAll(".status-legend").forEach(el => el.innerHTML = D.statusLegend.map(([k,v]) => `<span class="lg">${badge(k)} <span>${esc(v)}</span></span>`).join(""));

  // 앱바 D-day · 탭
  const TRIP_START = new Date("2026-12-23T00:00:00+08:00"), TRIP_END = new Date("2026-12-27T23:59:59+08:00");
  (function(){ const now = new Date(); const dd = Math.ceil((TRIP_START - now) / 864e5);
    $("dday").textContent = now > TRIP_END ? "여행 완료" : now >= TRIP_START ? `여행 중 · DAY ${Math.floor((now - TRIP_START) / 864e5) + 1}` : `D-${dd}`; })();
  $("asOf").textContent = "— 최종 수정 " + D.meta.lastUpdated;
  const TABS = [["plan","🗺","일정"],["book","🎫","예약"],["food","🍜","맛집"],["info","ℹ️","정보"]];
  let curTab = "plan";
  try { curTab = (location.hash.slice(1) && TABS.some(t => t[0] === location.hash.slice(1))) ? location.hash.slice(1) : (localStorage.getItem("hkmo2026-tab") || "plan"); } catch(e){}
  function showTab(t, push){
    if (!TABS.some(x => x[0] === t)) t = "plan";
    curTab = t;
    $("tabs").innerHTML = TABS.map(([k,ic,l]) => `<button class="${k===t?"on":""}" data-tab="${k}"><span class="ic">${ic}</span><span>${l}</span></button>`).join("");
    document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => showTab(b.dataset.tab, true));
    document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.dataset.panel === t));
    try { localStorage.setItem("hkmo2026-tab", t); } catch(e){}
    if (push) { try { history.replaceState(null, "", "#" + t); } catch(e){} window.scrollTo(0, 0); }
    if (t === "plan" && typeof renderDay === "function") renderDay();
  }

  // Budget totals
  const budgetTotals = () => {
    let krw = 0, hkd = 0; const cats = {}, byStatus = {};
    D.budget.forEach(b => { const k = toKRW(b.amount,b.currency); krw += k; hkd += toHKD(b.amount,b.currency);
      byStatus[b.status||"estimate"] = (byStatus[b.status||"estimate"]||0) + k;
      cats[b.category] = cats[b.category] || {krw:0,hkd:0,items:[]}; cats[b.category].krw += k; cats[b.category].hkd += toHKD(b.amount,b.currency); cats[b.category].items.push(b); });
    return {krw,hkd,cats,byStatus};
  };

  // 예약 탭 상단: 진행률 + 예약 완료 한눈에
  function renderBookTop(){
    const st = load(); const total = D.checklist.length;
    const done = D.checklist.filter(c => st[c.id] ?? !!c.done).length;
    const pct = Math.round(done/total*100);
    const hp = D.meta.hotelPlan, hh = D.meta.hkHotelPlan, o = D.flights[0], r = D.flights[1];
    const show = D.shows.find(s => s.booked);
    const north = D.restaurants.find(f => f.reservation);
    const rows = [
      ["✈", `${o.flightNo} ${o.date.slice(5)} ${o.from.time} 인천 → 홍콩 · ${r.flightNo} ${r.date.slice(5)} ${r.from.time} 홍콩 → 인천`],
      ["🏨", `${hp.selected} ${hp.nights}박 (12/23–12/26) · ${hh.selected} ${hh.nights}박 (12/26–12/27)`],
      north ? ["🍽", `${north.name.split(" / ")[0]} · ${north.reservation.date} ${north.reservation.time} · ${north.reservation.guests}`] : null,
      show && show.booking ? ["🎭", `${show.name} · ${show.booking.date} ${show.booking.time}`] : null
    ].filter(Boolean);
    $("bookTop").innerHTML = `<div class="card"><div class="progress-card"><div><div class="small muted">예약 진행률</div><div class="pv">${done} / ${total} (${pct}%)</div></div><div class="progress"><i style="width:${pct}%"></i></div></div>
      <div class="done-list">${rows.map(([k,v]) => `<div><span class="k">${k}</span><span>${esc(v)} <span class="rsv done">예약 완료</span></span></div>`).join("")}</div></div>`;
  }

  // ⑪ Check needed
  // 강조(highlight) 항목은 상단 카드로, 나머지는 기존 목록 — 총 개수는 동일하게 표시
  $("checkList").innerHTML = `<h3>⏰ 예약 대기 · 확인 필요</h3>`
    + D.checkNeeded.filter(c => c.highlight).map(c => `<div class="hl-card">
        <div class="hl-badges">${c.badges.map((b,i) => `<span class="hl-badge ${i===0?"hi":""}">${esc(b)}</span>`).join("")}</div>
        <h4>${esc(c.title)}</h4>
        <div class="hl-route">📍 ${esc(c.route)}</div><div class="hl-action">📅 ${esc(c.action)}</div>
        <div class="links">${bookingBtn(c.bookingRef)}</div>
        <details><summary>예약 입력정보 · 메모</summary>${c.inputs ? `<div class="inputs"><div class="inputs-title">예약 입력정보</div>${c.inputs.map(([k,v,n]) => `<div class="in-row"><span class="in-k">${esc(k)}</span><span class="in-v">${esc(v)}${n?`<small>${esc(n)}</small>`:""}</span></div>`).join("")}</div>` : ""}
        <ul class="tight small">${c.lines.map(x => `<li>${esc(x)}</li>`).join("")}</ul></details></div>`).join("")
    + `<details><summary>그 외 확인할 것 ${D.checkNeeded.filter(c => !c.highlight).length}건</summary><ul class="tight">${D.checkNeeded.filter(c => !c.highlight).map(c => `<li><b>${esc(c.title)}</b> ${badge("CHECK")}<br><span class="small muted">${esc(c.detail)}</span></li>`).join("")}</ul></details>`;

  // ② Flights
  $("flightCards").innerHTML = D.flights.map(f => `
    <div class="card">
      <div class="tl-head"><div><h3>${esc(f.label)} · ${esc(f.flightNo)}</h3><div class="meta">${esc(f.airline)} · ${esc(f.date)}</div></div>${stBadges(f)}</div>
      <div class="flight">
        <div class="ap"><b>${esc(f.from.code)}</b><div class="t">${esc(f.from.time)}</div><div class="s">${esc(f.from.city)} ${esc(f.from.terminal)}</div></div>
        <div class="mid">${esc(f.duration)}<div class="line"></div>✈</div>
        <div class="ap"><b>${esc(f.to.code)}</b><div class="t">${esc(f.to.time)}</div><div class="s">${esc(f.to.city)} ${esc(f.to.terminal)}</div></div>
      </div>
      <div class="small muted">PNR <b>${esc(f.pnr)}</b> · ${esc(f.bookingNo)}</div>
      <details><summary>메모</summary><ul class="tight small">${f.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul></details>
    </div>`).join("") + `<details class="card fold" style="grid-column:1/-1;margin-top:0"><summary>🧳 수하물 (1인, 왕복 동일)</summary><ul class="tight small">${D.baggage.map(b => `<li>${esc(b)}</li>`).join("")}</ul></details>`;

  // ③ Timeline — 트리플식: 날짜별 지도(번호 핀 + 이동 경로) + 번호 타임라인
  let curDay = 1;
  try { curDay = +(localStorage.getItem("hkmo2026-day")) || 1; } catch(e){}
  let dayMap = null;
  const MODES = {
    walk:{label:"도보", icon:"🚶", color:"#c9a24a", dash:"2 7", weight:4},
    taxi:{label:"택시", icon:"🚕", color:"#e0703a", weight:4},
    bus:{label:"버스·셔틀", icon:"🚌", color:"#2f6fd6", weight:4},
    rail:{label:"철도", icon:"🚆", color:"#7b5cc4", weight:4},
    tram:{label:"피크트램", icon:"🚋", color:"#7b5cc4", dash:"8 6", weight:4},
    ferry:{label:"페리", icon:"⛴", color:"#1fa2b8", dash:"10 6", weight:4},
    flight:{label:"항공", icon:"✈", color:"#8a94a6", dash:"4 8", weight:2}
  };
  const geoPts = g => (Array.isArray(g) ? g : g ? [g] : []).map(k => D.places[k]).filter(Boolean);
  const areaOf = ([lat,lng]) => lng > 120 ? "인천" : lng >= 114.0 ? "홍콩 시내" : lng >= 113.8 ? "홍콩 공항" : lat > 22.195 && lng > 113.565 ? "HZMB 마카오 口岸" : lat > 22.17 ? "마카오 반도" : lat < 22.13 ? "콜로안" : "코타이·타이파";
  const macroOf = p => { const a = areaOf(p); return a === "마카오 반도" || a === "콜로안" || a === "코타이·타이파" ? "마카오" : a; };
  // 번호 = 머무는 장소 (이동·항공 항목 제외, 좌표 있는 것)
  function dayStops(d){
    let n = 0;
    return d.items.map(it => {
      const pts = geoPts(it.geo);
      const isMove = it.region === "이동" || it.region === "항공" || /복귀/.test(it.place);
      return { it, pts, pin: pts[it.pin || 0] || pts[0], num: (!isMove && pts.length) ? ++n : null };
    });
  }
  function renderDay(){
    $("dayTabs").innerHTML = D.itinerary.map(d => `<button class="daytab ${d.day===curDay?"on":""}" data-day="${d.day}"><b>DAY ${d.day}</b><span>${esc(d.date)}</span></button>`).join("");
    const d = D.itinerary.find(x => x.day===curDay) || D.itinerary[0];
    const stops = dayStops(d);
    let folded = false; try { folded = localStorage.getItem("hkmo2026-mapfold") === "1"; } catch(e){}
    $("dayBody").innerHTML = `
      <div class="daygrid">
        <div class="daymap-wrap ${folded?"folded":""}" id="dayMapWrap">
          <div class="daymap" id="dayMap"></div>
          <div class="map-bar" id="mapBar"></div>
        </div>
        <div><div class="dayhead"><h3>DAY ${d.day} · ${esc(d.date)} — ${esc(d.title)}</h3></div>
        <div class="tl-tools"><button class="btn" id="tlAll">모두 펼치기</button></div>
        <div class="tl">${stops.map((s,i) => { const it = s.it; const m = MODES[it.mode]; return `
        <div class="tl-item ${it.key?"key":""} ${it.food?"food":""} ${s.pts.length?"has-num":""}" data-i="${i}" ${s.pts.length?'data-geo="1"':""}>
          ${s.num ? `<span class="tl-num ${esc(it.status)} ${it.food?"food":""}" title="지도에서 보기">${s.num}</span>` : s.pts.length ? `<span class="tl-num mv" title="지도에서 보기">${m ? m.icon : "•"}</span>` : ""}
          <div class="card">
          <div class="tl-head"><div><div class="tl-time">${esc(it.time)}<span class="tl-more">▾ 자세히</span></div><div class="tl-place">${esc(it.place)}</div>${s.num ? "" : `<div class="tl-sub">${esc(it.move)} · ${esc(it.moveTime)}</div>`}</div><div style="text-align:right">${stBadges(it)}</div></div>
          ${it.bookingRef ? `<div class="links">${bookingBtn(it.bookingRef)}</div>` : ""}
          <div class="tl-body">
          ${it.desc && it.desc.length ? `<ul class="tight small">${it.desc.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
          ${it.why ? `<div class="why"><b>ⓘ ${esc(it.why.q)}</b><div>${esc(it.why.a)}</div></div>` : ""}

  function drawDayMap(d, stops){
    if (dayMap) { dayMap.remove(); dayMap = null; }
    const wrap = $("dayMapWrap");
    if (!window.L) { wrap.style.display = "none"; document.querySelectorAll(".tl-item").forEach(el => el.querySelector(".tl-head").addEventListener("click", e => { if (!e.target.closest("a")) el.classList.toggle("open"); })); return; }
    // 경로: 하루 시작점(숙소) → 각 항목 좌표 순서대로
    const path = [];
    if (d.start && D.places[d.start]) path.push({ p: D.places[d.start], mode: null });
    stops.forEach(s => s.pts.forEach(p => { const last = path[path.length-1]; if (!last || last.p[0]!==p[0] || last.p[1]!==p[1]) path.push({ p, mode: s.it.mode || "walk" }); }));
    // 같은 좌표의 번호는 핀 하나로 묶기
    const pins = new Map();
    stops.forEach((s,i) => { if (!s.num) return; const p = s.pin; const k = p.join(","); if (!pins.has(k)) pins.set(k, { p, nums: [], idx: [], status: s.it.status, food: false }); const g = pins.get(k); g.nums.push(s.num); g.idx.push(i); if (s.it.status === "CONFIRMED") g.status = "CONFIRMED"; if (s.it.food) g.food = true; });
    // 지역 묶음 — 멀리 떨어진 구간(항공·HZMB)은 버튼으로 따로 확대
    const areas = []; path.forEach(x => { const a = areaOf(x.p); let g = areas.find(z => z.name === a); if (!g) areas.push(g = { name: a, pts: [] }); g.pts.push(x.p); });
    const macros = {}; path.forEach(x => (macros[macroOf(x.p)] = macros[macroOf(x.p)] || { pts: [], n: 0 }).pts.push(x.p));
    pins.forEach(g => macros[macroOf(g.p)].n += g.nums.length);
    const mainPts = (Object.values(macros).sort((a,b) => b.n - a.n)[0] || { pts: path.map(x => x.p) }).pts;
    dayMap = L.map("dayMap", { zoomControl: true, scrollWheelZoom: false });
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(dayMap);
    for (let i = 1; i < path.length; i++) { const m = MODES[path[i].mode] || MODES.walk; L.polyline([path[i-1].p, path[i].p], { color: m.color, weight: m.weight, opacity: .9, dashArray: m.dash || null, lineCap: "round" }).addTo(dayMap); }
    const markers = {};
    if (d.start && D.places[d.start]) L.circleMarker(D.places[d.start], { radius: 6, color: "#fff", weight: 2, fillColor: "#c9a24a", fillOpacity: 1 }).bindTooltip("출발 · 숙소").addTo(dayMap);
    pins.forEach(g => {
      const items = g.idx.map(i => stops[i].it);
      const icon = L.divIcon({ className: "pin-icon", html: `<div class="pin ${esc(g.status)} ${g.food?"food":""}">${g.nums.join("·")}</div>`, iconSize: [0,0] });
      const mk = L.marker(g.p, { icon, riseOnHover: true }).addTo(dayMap)
        .bindPopup(items.map((it,j) => `<div${j?' style="margin-top:6px"':""}><b>${g.nums[j]}. ${esc(it.place)}</b><br><span class="muted">${esc(it.time)}</span></div>`).join("") + (items[0].map ? `<div style="margin-top:6px"><a href="${mapUrl(items[0].map)}" target="_blank" rel="noopener">📍 Google Maps</a></div>` : ""));
      mk.on("click", () => focusItem(g.idx[0], false));
      g.idx.forEach(i => markers[i] = mk);
    });
    const fit = pts => pts.length === 1 ? dayMap.setView(pts[0], 16) : dayMap.fitBounds(L.latLngBounds(pts), { padding: [28,28], maxZoom: 16 });
    fit(mainPts);
    const usedModes = [...new Set(path.slice(1).map(x => x.mode))].filter(m => MODES[m]);
    const foldLabel = () => wrap.classList.contains("folded") ? "🗺 지도 펼치기" : "지도 접기";
    $("mapBar").innerHTML = (areas.length > 1 ? `<button class="btn" data-area="all">전체</button>` + areas.map((a,i) => `<button class="btn" data-area="${i}">${esc(a.name)}</button>`).join("") : "")
      + `<button class="btn map-fold">${foldLabel()}</button>`
      + `<span class="map-legend">${stops.some(s => s.it.food) ? `<span class="lg-food">🍴 주황 = 먹는 일정</span>` : ""}${usedModes.map(m => `<span><i style="border-color:${MODES[m].color};${MODES[m].dash?"border-top-style:dashed":""}"></i>${MODES[m].label}</span>`).join("")}</span>`;
    document.querySelectorAll("#mapBar [data-area]").forEach(b => b.onclick = () => { document.querySelectorAll("#mapBar [data-area]").forEach(x => x.classList.remove("on")); b.classList.add("on"); fit(b.dataset.area === "all" ? path.map(x => x.p) : areas[+b.dataset.area].pts); });
    document.querySelector("#mapBar .map-fold").onclick = e => { wrap.classList.toggle("folded"); const f = wrap.classList.contains("folded"); try { localStorage.setItem("hkmo2026-mapfold", f ? "1" : "0"); } catch(err){} e.currentTarget.textContent = foldLabel(); if (!f) dayMap.invalidateSize(); };
    function focusItem(i, fromList){
      document.querySelectorAll(".tl-item .card.focus").forEach(c => c.classList.remove("focus"));
      document.querySelectorAll(".pin.on").forEach(p => p.classList.remove("on"));
      const el = document.querySelector(`.tl-item[data-i="${i}"]`); if (el) el.querySelector(".card").classList.add("focus");
      const s = stops[i]; const mk = markers[i];
      if (mk && mk.getElement()) mk.getElement().querySelector(".pin").classList.add("on");
      if (fromList) {
        if (!s.pts.length) return;
        const a = areas.find(z => z.name === areaOf(s.pin));
        document.querySelectorAll("#mapBar [data-area]").forEach(b => b.classList.toggle("on", areas[+b.dataset.area] === a));
        dayMap.flyTo(s.pin, Math.max(dayMap.getZoom(), 15), { duration: .6 });
        if (mk) setTimeout(() => mk.openPopup(), 650);
      } else if (el) {
        el.scrollIntoView({ behavior: "smooth", block: window.innerWidth >= 900 ? "center" : "nearest" });
      }
    }
    document.querySelectorAll(".tl-item").forEach(el => {
      const go = e => { if (e.target.closest("a")) return; const wasOpen = el.classList.contains("open"); el.classList.toggle("open"); if (!wasOpen && el.dataset.geo) focusItem(+el.dataset.i, true); };
      el.querySelector(".tl-head").addEventListener("click", go);
      const num = el.querySelector(".tl-num"); if (num) num.addEventListener("click", go);
    });
  }

    const st = load();
    $("checkBody").innerHTML = `` + D.checklist.map(c => { const on = st[c.id] ?? !!c.done;
      return `<div class="check-item ${on?"done":""}"><input type="checkbox" id="ck-${esc(c.id)}" data-id="${esc(c.id)}" ${on?"checked":""}><label for="ck-${esc(c.id)}"><span class="t">${esc(c.label)}</span> ${stBadges(c)}${c.ref?`<div class="ref">${esc(c.ref)}</div>`:""}${c.bookingRef?`<div class="links" style="margin-top:6px">${bookingBtn(c.bookingRef)}</div>`:""}</label></div>`; }).join("")
      + `<div class="links"><button class="btn" id="ckReset">체크 상태 초기화</button></div>`;
    document.querySelectorAll("#checkBody input").forEach(i => i.onchange = () => { const s = load(); s[i.dataset.id] = i.checked; save(s); renderChecklist(); renderBookTop(); });
    $("ckReset").onclick = () => { try{localStorage.removeItem(storeKey);}catch(e){} renderChecklist(); renderBookTop(); };
  }
  $("prioBody").innerHTML = D.priority.map(p => `<div style="margin-top:12px"><h4>${esc(p.when)}</h4><ul class="tight small">${p.items.map(x => typeof x === "string" ? `<li>${esc(x)}</li>` : `<li>${esc(x.text)}<div class="links" style="margin-top:6px">${bookingBtn(x.bookingRef)}</div></li>`).join("")}</ul></div>`).join("");

  // 하단: Sources · Update History (접힘)
  $("historyBody").innerHTML = D.history.map(h => `<div class="ver"><b>${esc(h.date)}</b><ul class="tight small">${h.changes.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></div>`).join("");
  $("sourceList").innerHTML = D.sources.map(s => `<li>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`:esc(s.label)}</li>`).join("");

  renderBookTop(); renderHotels(); renderFood(); renderChecklist();
  showTab(curTab, false);
})();
</script>
</body>
</html>
